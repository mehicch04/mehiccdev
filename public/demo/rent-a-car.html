function local(el) {

    const p = n.offsetParent;

}

  C.style.transitionDuration = dur ? dur + "ms" : "";

const END = 71000 + 13200;
function tick(now) {
  const el = now - start;
  while (next < cues.length && cues[next].ms <= el) { cues[next].fn(); next++; }
  $("progress").style.width = Math.min(100, (el / END) * 100) + "%";
  if (el >= END) { run(); return; }
  raf = requestAnimationFrame(tick);
}
function run() {
  unlockAudio();
  cancelAnimationFrame(raf); build(); timeline();
  page("pg-home", "<b>rentacarsarajevo.ba</b>");
  next = 0; start = performance.now(); paused = 0; playing = true; applyCopy();
  raf = requestAnimationFrame(tick);
}
function toggle() {
  unlockAudio();
  if (playing) { playing = false; paused = performance.now() - start; cancelAnimationFrame(raf); }
  else { playing = true; start = performance.now() - paused; raf = requestAnimationFrame(tick); }
  applyCopy();
}
function still() {
  cancelAnimationFrame(raf); build(); timeline(); page("pg-home", "<b>rentacarsarajevo.ba</b>");
  const on = SFX.on; SFX.on = false;
  cues.filter((c) => c.ms <= 66000 + 13200).forEach((c) => c.fn());
  SFX.on = on;
  playing = false; applyCopy(); $("progress").style.width = "0";
}
function fit() { $("stage").style.transform = `scale(${$("viewport").clientWidth / 1280})`; }

$("play").addEventListener("click", toggle);
$("replay").addEventListener("click", run);
$("lang-bs").addEventListener("click", () => { lang = "bs"; run(); });
$("lang-en").addEventListener("click", () => { lang = "en"; run(); });
window.addEventListener("resize", fit);
document.addEventListener("visibilitychange", () => { if (document.hidden && playing) toggle(); });

fit();

const PARAMS = new URLSearchParams(location.search);
const EMBED = PARAMS.has("embed");
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (PARAMS.get("lang") === "en") lang = "en";
if (EMBED) {
  document.documentElement.classList.add("embed");
  document.documentElement.dataset.theme = "light";
  fit();
  new ResizeObserver(fit).observe($("viewport"));
}

let started = false;
function startOrResume() {
  if (REDUCED) return;
  if (!started) { started = true; run(); }
  else if (!playing) toggle();
}

if (REDUCED) still();
else if (EMBED) { still(); }
else { started = true; run(); }

if (EMBED) {
  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin) return;
    const m = e.data || {};
    if (m.type === "unlock-audio") unlockAudio();
    if (m.type === "lang" && (m.lang === "bs" || m.lang === "en") && m.lang !== lang) {
      lang = m.lang;
      if (started && !REDUCED) run(); else { still(); applyCopy(); }
    }
    if (m.type === "visible") startOrResume();
    if (m.type === "hidden" && playing) toggle();
    if (m.type === "toggle") { if (!started) { started = true; run(); } else toggle(); }
    if (m.type === "replay") { started = true; run(); }
  });

  let lastState = null;
  setInterval(() => {
    if (playing !== lastState) {
      lastState = playing;
      parent.postMessage({ type: "demo-state", playing }, location.origin);
    }
  }, 250);

  const reportHeight = () => parent.postMessage(
    { type: "demo-height", h: Math.ceil(document.documentElement.scrollHeight) }, location.origin);
  new ResizeObserver(reportHeight).observe(document.body);
  window.addEventListener("load", reportHeight);
  reportHeight();
}
</script>
